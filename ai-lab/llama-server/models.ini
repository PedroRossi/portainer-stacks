version = 1
; llama-server router presets for a GTX 16xx card (6 GB GPU, 32 GB RAM).
; One section per model: the section name is the model id that Open WebUI and the API use.
; Keys are llama-server arguments without the leading dashes. The router loads one model at a time
; (--models-max 1): asking for another model unloads the current one first.
; Models downloaded through the router (llama.cpp's web UI, Open WebUI's "Model manager", or POST /models)
; land in the cache and use only the [*] defaults, with --fit placing them in GPU memory automatically.
; Paths are inside the container: /models = $LLM_HOME/models on the host.

[*]
; GTX 16xx defaults: FlashAttention (FP16 tile kernel on these cards), 4-bit KV cache, large batches
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
threads = 8
batch-size = 2048
ubatch-size = 1024
jinja = true
parallel = 1
cache-ram = 3072
metrics = true
; MoE models keep every layer's experts in RAM and the rest on the GPU: that's what makes the 35B-A3B
; models fast here (a downloaded one: 37 t/s, against 5 t/s with --fit alone). No effect on dense models.
n-cpu-moe = 99
; then --fit sizes the GPU layers and the context for models without a preset, keeping 768 MiB free
fit = on
fit-target = 768

[qwen3.6-35b-a3b]
; Qwen3.6-35B-A3B, Unsloth UD-Q2_K_XL (2.83 bits/weight), vision on the GPU; native 262,144-token window
model = /models/qwen3.6-35b-a3b-mtp/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
mmproj = /models/qwen3.6-35b-a3b-mtp/mmproj-F16.gguf
ctx-size = 262144
n-gpu-layers = 99
n-cpu-moe = 40
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
load-on-startup = true

[qwen3.6-35b-a3b-512k]
; the same model with a 524,288-token window: YaRN x2; past ~400K tokens the cache spills to RAM
model = /models/qwen3.6-35b-a3b-mtp/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
mmproj = /models/qwen3.6-35b-a3b-mtp/mmproj-F16.gguf
ctx-size = 524288
rope-scaling = yarn
rope-scale = 2
yarn-orig-ctx = 262144
ubatch-size = 512
n-gpu-layers = 99
n-cpu-moe = 40
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

[gemma-4-26b-a4b]
; Gemma 4 26B-A4B, Google's QAT 4-bit (Unsloth UD-Q4_K_XL), vision; experts in RAM.
; Capped at 131,072 tokens: with its vision encoder on the GPU, a 256K cache would spill to RAM.
model = /models/gemma-4-26b-a4b-it-qat/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-26b-a4b-it-qat/mmproj-F16.gguf
ctx-size = 131072
n-gpu-layers = 99
n-cpu-moe = 30
temp = 1.0
top-p = 0.95
top-k = 64
