# ai-lab: a local AI stack, aimed at NVIDIA GTX 16xx cards for now.
# Deploy it in Portainer as a Git-backed stack (compose path ai-lab/docker-compose.yaml), or with docker compose.
#
#   default             rustingstrata :8080   RustingStrata serving Qwen3.6-35B-A3B (262K window, vision):
#                                             experts that don't fit in VRAM run on the CPU alongside the GPU,
#                                             the most-used ones are cached in VRAM. OpenAI/Anthropic API
#                       open-webui    :11435  chat front end, wired to rustingstrata (plain OpenAI connection)
#                       pgvector      (none)  Postgres with pgvector: Open WebUI's vector store (RAG)
#                       open-terminal :18800  shell/code sandbox for the AI (bearer key required)
#   profile "llamacpp"  llama-server  :8080   the llama.cpp router: several models one at a time (Gemma 4, downloads,
#                                             a web UI that manages them). Off: only one engine fits on the GPU.
#                                             To switch back, stop rustingstrata and set COMPOSE_PROFILES=llamacpp
#   profile "image"     comfyui :8188, forge :17860   (disabled for now: COMPOSE_PROFILES is unset)
#
# GPU: on a 6 GB card the model holds 4-5.5 GB. Start the "image" services only after stopping the model server.
# In Portainer, enable profiles with the stack variable COMPOSE_PROFILES.
#
# Portainer CE can't bind-mount files from the repo, so every bind mount is an absolute host path under
# LLM_HOME (default /home/pedro/llm). $LLM_HOME/ai-lab mirrors this folder, plus the data dirs and two secret files
# kept out of git and Portainer: open-terminal.key, and pgvector.password (one line of letters and digits).
# picoclaw-config.json and chromadb.yaml are kept here for later; nothing mounts them now.
services:
  rustingstrata:
    image: rustingstrata:f71f857
    build: ./rustingstrata         # used only when the tag is missing on the host: bump the tag to rebuild
    container_name: rustingstrata
    restart: unless-stopped
    user: "1000:1000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # One model: Qwen3.6-35B-A3B UD-Q2_K_XL with its full 262K window (q4 KV cache, 1.4 GB), its vision projector
    # and Qwen's recommended sampling. Measured against the llama.cpp router on a GTX 1660 SUPER (see the README).
    command:
      - serve
      - --model
      - /models/qwen3.6-35b-a3b-mtp/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      - --mmproj
      - /models/qwen3.6-35b-a3b-mtp/mmproj-BF16.gguf
      - --alias
      - qwen3.6-35b-a3b
      - --gpu
      - --backend
      - cuda
      - --ctx
      - "262144"
      - --kv
      - q4
      - --addr
      - 0.0.0.0:8080
      - --temp
      - "1.0"
      - --top-k
      - "20"
      - --top-p
      - "0.95"
      - --min-p
      - "0"
    environment:
      TZ: America/Recife
      HOME: /data                    # compiled kernels, the expert profile and the calibration file
      STRATA_NO_UPDATE_CHECK: "1"    # the image pins a commit; updates go through the Dockerfile
      # Host names (and IP addresses) clients may use to reach the API, besides localhost: requests naming any other
      # host get 403 (a DNS-rebinding guard). rustingstrata is the name Open WebUI uses. Add the host's own address
      # and name with the Portainer stack variable STRATA_ALLOWED_HOSTS (comma-separated; kept out of git).
      STRATA_ALLOWED_HOSTS: ${STRATA_ALLOWED_HOSTS:-rustingstrata}
    volumes:
      - ${LLM_HOME:-/home/pedro/llm}/models:/models:ro
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/rustingstrata-data:/data
    ports:
      - "8080:8080"

  llama-server:
    profiles: ["llamacpp"]           # off by default: rustingstrata holds the GPU and port 8080
    image: llama-server:51831d4
    build: ./llama-server          # used only when the tag is missing on the host: bump the tag to rebuild
    container_name: llama-server
    restart: unless-stopped
    user: "1000:1000"              # downloaded models ($LLM_HOME/models/hf-cache) stay owned by the host user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Router mode: one model at a time (--models-max 1); asking for another model unloads the current one.
    # Models and their settings: models.ini (presets), plus anything downloaded into the cache.
    # --ui-config: the web UI's Models page and its Hugging Face search ("Discover") are off by default.
    command:
      - --models-preset
      - /config/models.ini
      - --models-max
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ui-config
      - '{"showModelsManager": true, "enableDiscoverModels": true, "useHuggingFaceHub": true}'
    environment:
      TZ: America/Recife
      LLAMA_CACHE: /cache                       # where downloads go
      # Safety net: GPU memory spills to RAM instead of crashing (the 512k preset needs it)
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "1"
    volumes:
      - ${LLM_HOME:-/home/pedro/llm}/models:/models:ro
      - ${LLM_HOME:-/home/pedro/llm}/models/hf-cache:/cache
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/llama-server:/config:ro   # the folder, not the file: a models.ini replaced by an editor or rsync still shows up
    ports:
      - "8080:8080"

  comfyui:
    profiles: ["image"]
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      COMFYUI_ARGS: --listen --port 8188 --preview-method auto
      WEB_PORT: 8188
      WEB_ENABLE_AUTH: "false"
      SERVERLESS: "true"
    volumes:
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/comfy-data/user:/opt/ComfyUI/user
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/comfy-data/output:/opt/ComfyUI/output
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/forge-data/models/Stable-diffusion:/opt/ComfyUI/models/checkpoints
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/forge-data/models/VAE:/opt/ComfyUI/models/vae
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/forge-data/models/LoRA:/opt/ComfyUI/models/loras
    ports:
      - "8188:8188"
  forge:
    profiles: ["image"]
    image: ghcr.io/ai-dock/stable-diffusion-webui-forge:latest-cuda
    container_name: forge-headless
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # --api: Permite o OpenWebUI mandar comandos
      # --no-half-vae: Evita imagens pretas/erro NaN na série 16xx
      # --xformers: Otimização agressiva de memória
      FORGE_ARGS: "--listen --api --no-half-vae --xformers"
      FORGE_PORT_HOST: "7860"
      FORGE_URL: "0.0.0.0:7860"
      WEB_ENABLE_AUTH: "false"
      SERVERLESS: "true"
    volumes:
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/forge-data/models:/opt/stable-diffusion-webui-forge/models
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/forge-data/outputs:/opt/stable-diffusion-webui-forge/outputs
    ports:
      - "17860:17860"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/sdapi/v1/progress"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.5
    container_name: open-webui
    restart: unless-stopped
    # Open WebUI takes the vector store's address only from PGVECTOR_DB_URL: build it from the password file,
    # then start as usual
    entrypoint: ["/bin/bash", "-c", "export PGVECTOR_DB_URL=\"postgresql://openwebui:$$(cat /run/secrets/pgvector.password)@pgvector:5432/openwebui\" && exec bash start.sh"]
    depends_on:
      pgvector: {condition: service_healthy}
    environment:
      ENABLE_OLLAMA_API: false            # no Ollama: one model server on port 8080
      ENABLE_OPENAI_API: true
      # Stored in Open WebUI's database once set: after switching engines, change the connection in
      # Admin Panel -> Settings -> Connections (rustingstrata: Provider default; llama-server: Provider "llama.cpp")
      OPENAI_API_BASE_URL: http://rustingstrata:8080/v1
      OPENAI_API_KEY: "sk-unused"
      WEBUI_AUTH: false
      ENABLE_TITLE_GENERATION: true
      ENABLE_DIRECT_CONNECTIONS: true
      # RAG, chosen by measurement on 2026-11-27 (see the README): pgvector, bge-small-en-v1.5, hybrid search off.
      # The vector length is fixed when pgvector's table is first made: it must match the embedding model (384).
      VECTOR_DB: pgvector
      PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: 384
      PGVECTOR_INDEX_METHOD: hnsw         # the default (ivfflat) gives poor results until the table holds thousands of rows
      RAG_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      ENABLE_RAG_HYBRID_SEARCH: false     # its keyword half finds nothing for question-like queries
      # https://github.com/openai/whisper
      WHISPER_MODEL: small
      # https://docs.openwebui.com/getting-started/env-configuration/#web-loader-configuration
      # TODO: enhance this later
      ENABLE_WEB_SEARCH: true
      WEB_SEARCH_RESULT_COUNT: 5
      ENABLE_IMAGE_GENERATION: false      # off while ComfyUI/Forge are disabled (profile "image")
      IMAGE_GENERATION_ENGINE: automatic1111
      AUTOMATIC1111_BASE_URL: http://forge:7860
      IMAGE_SIZE: 512x512
    ports:
      - "11435:8080"
    volumes:
      - open-webui:/app/backend/data
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/pgvector.password:/run/secrets/pgvector.password:ro
  open-terminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: open-terminal
    restart: unless-stopped
    environment:
      # A fixed bearer key, kept out of git and Portainer: a file on the host.
      # Without one, open-terminal makes up a new random key at every start.
      OPEN_TERMINAL_API_KEY_FILE: /run/secrets/open-terminal.key
    volumes:
      - open-terminal:/home/user
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/open-terminal.key:/run/secrets/open-terminal.key:ro
    ports:
      - "18800:8000"
  pgvector:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: pgvector
    restart: unless-stopped
    environment:
      TZ: America/Recife
      POSTGRES_USER: openwebui
      POSTGRES_DB: openwebui
      POSTGRES_PASSWORD_FILE: /run/secrets/pgvector.password   # read once, when the database is first made
    volumes:
      - pgvector:/var/lib/postgresql   # Postgres 18 keeps its data under here (PGDATA=/var/lib/postgresql/18/docker)
      # Owned by uid 999 (postgres) with the host user's group, mode 640: Postgres must be able to read it
      - ${LLM_HOME:-/home/pedro/llm}/ai-lab/pgvector.password:/run/secrets/pgvector.password:ro
    # No published port: only Open WebUI uses it, over the stack's network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui -d openwebui"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3

volumes:
  open-webui:
    external: true
    name: ollama_open-webui       # Open WebUI's chats and settings
  open-terminal:
    external: true
    name: ollama_open-terminal    # Open Terminal's home directory
  pgvector:
    name: pgvector-data           # Open WebUI's vectors
